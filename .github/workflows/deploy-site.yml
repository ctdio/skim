name: Deploy site

# Builds the Astro + Starlight site in /site and deploys it to GitHub Pages.
#
# Targets the owner repo's Pages (ctdio.github.io/skim). The maintainer must
# enable Pages once, with Source: "GitHub Actions" (Settings → Pages). After
# that, every push to `main` that touches `site/**` (or this workflow) rebuilds
# and redeploys automatically.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Least-privilege token plus the OIDC/id-token permission the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production
# deploy if another push lands (queue it instead).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        # `site` and `base` (=/skim) come from astro.config.mjs, so the built
        # output is already scoped to the /skim/ Pages path.
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
