query SkimSyncIndex($owner: String!, $name: String!, $cursor: String) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    pullRequests(states: OPEN, first: 100, after: $cursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        number
        title
        isDraft
        updatedAt
        url
        headRefName
        baseRefName
        headRefOid
        baseRefOid
        author {
          login
        }
        labels(first: 20) {
          nodes {
            name
          }
        }
      }
    }
  }
}
